<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div class="recipe_container d-flex flex-column justify-content-center align-items-center gap-5">
        <p class="h2">Recipe Finder</p>
        <div class="input-group mb-3">
            <input type="text" class="form-control input_recipe" placeholder="Search by name (e.g., Chicken)" aria-label="Recipient’s username" aria-describedby="basic-addon2">
            <span class="input-group-text d-flex justify-content-center align-items-center text-light bg-success" id="basic-addon2">Search</span>
        </div>
        <button type="button" class="btn p-3 text-light fw-semibold fs-4 random_btn">Get Random Recipe</button>
        <div class="message fs-4 py-3 px-5">Search for a recipe or get a random meal</div>
        <div class="card-container">
            <!-- <div class="card">
                <img src="./image.png" class="card-img-top" alt="...">
                <div class="card-body fs-2">
                    <h5 class="card-title fs-1">Card title</h5>
                    <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s content.</p>
                    <a href="#" class="btn btn-primary">Go somewhere</a>
                </div>
            </div> -->
        </div>
        <div class="modal_popup hidden">
            <img src="./image.png" alt="Image of Recipe" class="img_more">
            <div class="recipe_name fs-3 px-4"><b class="fs-3 fw-2">Name of the Recipe: </b>Chicken</div>
            <div class="recipe_category fs-3 px-4"><b class="fs-3 fw-2">Category of the Recipe:</b> Category</div>
        </div>
    </div>
</body>
</html>
